<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>갤러리아</title>
  <style>
    :root {
      --blue-900: #0b2a5b;
      --blue-700: #1553b6;
      --blue-500: #2f80ed;
      --blue-200: #cfe2ff;
      --blue-50: #eef5ff;
      --text: #12233f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--blue-50);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-500));
      color: #fff;
      text-align: center;
      padding: 56px 20px 48px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 2.4rem;
      letter-spacing: 2px;
    }

    header p {
      margin: 0;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 190px;
      padding: 22px;
      background: #fff;
      border: 1px solid var(--blue-200);
      border-top: 6px solid var(--blue-500);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(21, 83, 182, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(21, 83, 182, 0.2);
      outline: none;
    }

    .card .num {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--blue-500);
    }

    .card h2 {
      margin: 6px 0 0;
      font-size: 1.15rem;
      color: var(--blue-900);
    }

    .card .open {
      margin-top: 18px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--blue-700);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: var(--blue-700);
    }

    @media (max-width: 600px) {
      header { padding: 40px 16px 34px; }
      header h1 { font-size: 1.9rem; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>갤러리아</h1>
    <p>제갤러리에여</p>
  </header>

  <main>
    <div class="grid">

      <a class="card" href="pdf/sleep-habits-morning-condition-slides.pdf" target="_blank" rel="noopener">
        <div>
          <span class="num">작품 01</span>
          <h2>데우이 프로젝트 발표자료</h2>
        </div>
        <span class="open">PDF 열기 →</span>
      </a>

      <a class="card" href="pdf/orange3-linear-regression-report.pdf" target="_blank" rel="noopener">
        <div>
          <span class="num">작품 02</span>
          <h2>선형회귀 프로젝트</h2>
        </div>
        <span class="open">PDF 열기 →</span>
      </a>

      <a class="card" href="pdf/google-forms-class-sleep-survey-report.pdf" target="_blank" rel="noopener">
        <div>
          <span class="num">작품 03</span>
          <h2>데우이 프로젝트</h2>
        </div>
        <span class="open">PDF 열기 →</span>
      </a>

      <a class="card" href="pdf/flourish-public-data-visualization-report.pdf" target="_blank" rel="noopener">
        <div>
          <span class="num">작품 04</span>
          <h2>공공데이터 시각화 프로젝트</h2>
        </div>
        <span class="open">PDF 열기 →</span>
      </a>

    </div>
  </main>

  <footer>© 갤러리아</footer>

</body>
</html>
